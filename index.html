<script src="fphw.js"></script> 
<script>Fingerprinter.getFingerprint(async function(shortHash, encrypted) {
    if (shortHash) {
        console.log("Short Fingerprint:", shortHash); // короткий идентификатор
        Fingerprinter.parseFingerprint(encrypted, function(data) {
            console.log("Decoded ", data);
        });
    } else {
        console.log("Failed to get data.");
    }
});</script>
